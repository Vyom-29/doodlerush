name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_SOCKET_URL: https://socket.example.com
          WEB_ORIGIN: https://doodlerush.example.com
          NODE_ENV: production
